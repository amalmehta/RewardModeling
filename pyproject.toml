[project]
name = "rewardshapes"
version = "0.1.0"
description = "Reward Shapes: how reward shape changes reward recovery in gridworlds"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.2.2",
  "numpy>=1.26,<2",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["rewardshapes"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
